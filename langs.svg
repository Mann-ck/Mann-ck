<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Mann Checker - Technologies">
<defs>
  <clipPath id="langsClip"><rect width="480" height="260" rx="14" ry="14"/></clipPath>
  <filter id="langGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d0014"/>
    <stop offset="100%" stop-color="#1a0030"/>
  </linearGradient>
  <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#ff9ee0"/>
  </linearGradient>
  <linearGradient id="barTs" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#a020f0"/>
    <stop offset="100%" stop-color="#c050ff"/>
  </linearGradient>
  <linearGradient id="barJs" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#c850c0"/>
    <stop offset="100%" stop-color="#e080e0"/>
  </linearGradient>
  <linearGradient id="barJava" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#e040a0"/>
    <stop offset="100%" stop-color="#ff70c0"/>
  </linearGradient>
  <linearGradient id="barSql" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7030d0"/>
    <stop offset="100%" stop-color="#9060f0"/>
  </linearGradient>
  <linearGradient id="barCpp" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9020e0"/>
    <stop offset="100%" stop-color="#b050ff"/>
  </linearGradient>
  <linearGradient id="barAI" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff4090"/>
    <stop offset="100%" stop-color="#ff80b0"/>
  </linearGradient>
  <linearGradient id="langTitle" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#a020f0"/>
  </linearGradient>
  <linearGradient id="langShine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<g clip-path="url(#langsClip)">
  <rect width="480" height="260" fill="url(#langsBg)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="#c850c0" stroke-width="0.5">
    <line x1="0" y1="50" x2="480" y2="50"/><line x1="0" y1="100" x2="480" y2="100"/>
    <line x1="0" y1="150" x2="480" y2="150"/><line x1="0" y1="200" x2="480" y2="200"/>
    <line x1="96" y1="0" x2="96" y2="260"/><line x1="192" y1="0" x2="192" y2="260"/>
    <line x1="288" y1="0" x2="288" y2="260"/><line x1="384" y1="0" x2="384" y2="260"/>
  </g>

  <!-- Title -->
  <text x="24" y="32" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="url(#langTitle)" filter="url(#langGlow)">Technologies &amp; Languages</text>
  <line x1="24" y1="42" x2="456" y2="42" stroke="#c850c0" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="456" y="32" font-family="'Courier New',monospace" font-size="9" fill="#8060a0" text-anchor="end">known stack • not % of commits</text>

  <!-- Helper macro: label | track | animated bar | dot -->
  <!-- Python -->
  <text x="24" y="68" font-family="'Courier New',monospace" font-size="11" fill="#ff6ec7">Python</text>
  <rect x="110" y="58" width="310" height="10" rx="5" fill="#1e0035"/>
  <rect x="110" y="58" width="0" height="10" rx="5" fill="url(#barPy)" filter="url(#langGlow)">
    <animate attributeName="width" values="0;280" dur="1.2s" fill="freeze" begin="0.3s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <circle cx="430" cy="63" r="5" fill="#ff6ec7" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="1.5s"/></circle>
  <text x="442" y="68" font-family="'Courier New',monospace" font-size="9" fill="#ff6ec7" opacity="0">★★★★★<animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="1.5s"/></text>

  <!-- TypeScript -->
  <text x="24" y="98" font-family="'Courier New',monospace" font-size="11" fill="#a020f0">TypeScript</text>
  <rect x="110" y="88" width="310" height="10" rx="5" fill="#1e0035"/>
  <rect x="110" y="88" width="0" height="10" rx="5" fill="url(#barTs)" filter="url(#langGlow)">
    <animate attributeName="width" values="0;248" dur="1.2s" fill="freeze" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="442" y="98" font-family="'Courier New',monospace" font-size="9" fill="#a020f0" opacity="0">★★★★☆<animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="1.7s"/></text>

  <!-- JavaScript -->
  <text x="24" y="128" font-family="'Courier New',monospace" font-size="11" fill="#c850c0">JavaScript</text>
  <rect x="110" y="118" width="310" height="10" rx="5" fill="#1e0035"/>
  <rect x="110" y="118" width="0" height="10" rx="5" fill="url(#barJs)" filter="url(#langGlow)">
    <animate attributeName="width" values="0;248" dur="1.2s" fill="freeze" begin="0.7s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="442" y="128" font-family="'Courier New',monospace" font-size="9" fill="#c850c0" opacity="0">★★★★☆<animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="1.9s"/></text>

  <!-- Java -->
  <text x="24" y="158" font-family="'Courier New',monospace" font-size="11" fill="#e040a0">Java</text>
  <rect x="110" y="148" width="310" height="10" rx="5" fill="#1e0035"/>
  <rect x="110" y="148" width="0" height="10" rx="5" fill="url(#barJava)" filter="url(#langGlow)">
    <animate attributeName="width" values="0;217" dur="1.2s" fill="freeze" begin="0.9s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="442" y="158" font-family="'Courier New',monospace" font-size="9" fill="#e040a0" opacity="0">★★★★☆<animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="2.1s"/></text>

  <!-- SQL / MySQL -->
  <text x="24" y="188" font-family="'Courier New',monospace" font-size="11" fill="#7030d0">SQL / MySQL</text>
  <rect x="110" y="178" width="310" height="10" rx="5" fill="#1e0035"/>
  <rect x="110" y="178" width="0" height="10" rx="5" fill="url(#barSql)" filter="url(#langGlow)">
    <animate attributeName="width" values="0;265" dur="1.2s" fill="freeze" begin="1.1s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="442" y="188" font-family="'Courier New',monospace" font-size="9" fill="#7030d0" opacity="0">★★★★★<animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="2.3s"/></text>

  <!-- C++ -->
  <text x="24" y="218" font-family="'Courier New',monospace" font-size="11" fill="#9020e0">C++</text>
  <rect x="110" y="208" width="310" height="10" rx="5" fill="#1e0035"/>
  <rect x="110" y="208" width="0" height="10" rx="5" fill="url(#barCpp)" filter="url(#langGlow)">
    <animate attributeName="width" values="0;186" dur="1.2s" fill="freeze" begin="1.3s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="442" y="218" font-family="'Courier New',monospace" font-size="9" fill="#9020e0" opacity="0">★★★☆☆<animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="2.5s"/></text>

  <!-- AI/ML -->
  <text x="24" y="248" font-family="'Courier New',monospace" font-size="11" fill="#ff4090">AI / ML / NLP</text>
  <rect x="110" y="238" width="310" height="10" rx="5" fill="#1e0035"/>
  <rect x="110" y="238" width="0" height="10" rx="5" fill="url(#barAI)" filter="url(#langGlow)">
    <animate attributeName="width" values="0;248" dur="1.2s" fill="freeze" begin="1.5s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="442" y="248" font-family="'Courier New',monospace" font-size="9" fill="#ff4090" opacity="0">★★★★☆<animate attributeName="opacity" values="0;1" dur="0.2s" fill="freeze" begin="2.7s"/></text>

  <!-- Shine sweep -->
  <rect x="-480" y="0" width="480" height="260" fill="url(#langShine)">
    <animate attributeName="x" values="-480;480" dur="4s" repeatCount="indefinite" begin="3s"/>
  </rect>

  <!-- Border -->
  <rect x="1" y="1" width="478" height="258" rx="13" fill="none" stroke="#a020f0" stroke-width="1.5" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
