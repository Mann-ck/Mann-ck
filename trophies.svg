<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Mann Checker - Developer Milestones">
<defs>
  <clipPath id="trClip"><rect width="480" height="280" rx="14" ry="14"/></clipPath>
  <filter id="trGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="trGlowSoft" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d0014"/>
    <stop offset="100%" stop-color="#1a0030"/>
  </linearGradient>
  <linearGradient id="trTitle" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#a020f0"/>
  </linearGradient>
  <!-- Gold trophy gradient -->
  <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffe680"/>
    <stop offset="50%" stop-color="#ffd700"/>
    <stop offset="100%" stop-color="#cc9900"/>
  </linearGradient>
  <!-- Silver -->
  <linearGradient id="silverTrophy" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f0f0f0"/>
    <stop offset="50%" stop-color="#c8c8c8"/>
    <stop offset="100%" stop-color="#909090"/>
  </linearGradient>
  <!-- Bronze -->
  <linearGradient id="bronzeTrophy" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#e8a070"/>
    <stop offset="50%" stop-color="#cd7f32"/>
    <stop offset="100%" stop-color="#9a5a20"/>
  </linearGradient>
  <!-- Pink special -->
  <linearGradient id="pinkTrophy" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffb0e0"/>
    <stop offset="50%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#c020a0"/>
  </linearGradient>
  <!-- Purple special -->
  <linearGradient id="purpleTrophy" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#d080ff"/>
    <stop offset="50%" stop-color="#a020f0"/>
    <stop offset="100%" stop-color="#6010b0"/>
  </linearGradient>
  <!-- Cyan special -->
  <linearGradient id="cyanTrophy" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#80eeff"/>
    <stop offset="50%" stop-color="#00c8e0"/>
    <stop offset="100%" stop-color="#0080a0"/>
  </linearGradient>
  <linearGradient id="cellBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e0035" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#0d001e" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="trShine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<g clip-path="url(#trClip)">
  <rect width="480" height="280" fill="url(#trBg)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="#c850c0" stroke-width="0.5">
    <line x1="0" y1="56" x2="480" y2="56"/><line x1="0" y1="140" x2="480" y2="140"/>
    <line x1="0" y1="224" x2="480" y2="224"/>
    <line x1="80" y1="0" x2="80" y2="280"/><line x1="160" y1="0" x2="160" y2="280"/>
    <line x1="240" y1="0" x2="240" y2="280"/><line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
  </g>

  <!-- Title -->
  <text x="24" y="32" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="url(#trTitle)" filter="url(#trGlow)">Developer Milestones</text>
  <line x1="24" y1="42" x2="456" y2="42" stroke="#c850c0" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Trophy cell helper: reusable trophy shape inline per cell -->
  <!-- 6 cells: 3 per row, each 148w x 90h -->

  <!-- ===== ROW 1 ===== -->

  <!-- Cell 1: CS Graduate -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.4s"/>
    <rect x="16" y="52" width="140" height="88" rx="10" fill="url(#cellBg)" stroke="#ffd700" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Trophy icon -->
    <path d="M 58 72 Q 54 72 54 78 Q 54 88 64 91 Q 66 96 60 98 L 80 98 Q 74 96 76 91 Q 86 88 86 78 Q 86 72 82 72 Z" fill="url(#goldTrophy)" filter="url(#trGlowSoft)"/>
    <rect x="64" y="96" width="12" height="4" rx="2" fill="url(#goldTrophy)"/>
    <rect x="60" y="100" width="20" height="3" rx="1.5" fill="url(#goldTrophy)"/>
    <!-- Rank badge -->
    <rect x="52" y="64" width="16" height="11" rx="5" fill="#ffd700"/>
    <text x="60" y="73" font-family="'Courier New',monospace" font-size="7" fill="#1a0a00" text-anchor="middle" font-weight="700">SSS</text>
    <!-- Label -->
    <text x="88" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#ffd700" font-weight="700">CS Graduate</text>
    <text x="88" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#c8a840">Completed degree</text>
    <text x="88" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#a08020">in Computer Science</text>
    <!-- Glow pulse -->
    <rect x="16" y="52" width="140" height="88" rx="10" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
  </g>

  <!-- Cell 2: Backend Builder -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.65s"/>
    <rect x="170" y="52" width="140" height="88" rx="10" fill="url(#cellBg)" stroke="#ff6ec7" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 212 72 Q 208 72 208 78 Q 208 88 218 91 Q 220 96 214 98 L 234 98 Q 228 96 230 91 Q 240 88 240 78 Q 240 72 236 72 Z" fill="url(#pinkTrophy)" filter="url(#trGlowSoft)"/>
    <rect x="218" y="96" width="12" height="4" rx="2" fill="url(#pinkTrophy)"/>
    <rect x="214" y="100" width="20" height="3" rx="1.5" fill="url(#pinkTrophy)"/>
    <rect x="206" y="64" width="16" height="11" rx="5" fill="#ff6ec7"/>
    <text x="214" y="73" font-family="'Courier New',monospace" font-size="7" fill="#1a0030" text-anchor="middle" font-weight="700">S</text>
    <text x="242" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#ff6ec7" font-weight="700">API Builder</text>
    <text x="242" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#d050a0">FastAPI &amp; Spring Boot</text>
    <text x="242" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#a03080">REST API developer</text>
    <rect x="170" y="52" width="140" height="88" rx="10" fill="none" stroke="#ff6ec7" stroke-width="1.5" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite" begin="0.65s"/>
    </rect>
  </g>

  <!-- Cell 3: AI Explorer -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.9s"/>
    <rect x="324" y="52" width="140" height="88" rx="10" fill="url(#cellBg)" stroke="#a020f0" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 366 72 Q 362 72 362 78 Q 362 88 372 91 Q 374 96 368 98 L 388 98 Q 382 96 384 91 Q 394 88 394 78 Q 394 72 390 72 Z" fill="url(#purpleTrophy)" filter="url(#trGlowSoft)"/>
    <rect x="372" y="96" width="12" height="4" rx="2" fill="url(#purpleTrophy)"/>
    <rect x="368" y="100" width="20" height="3" rx="1.5" fill="url(#purpleTrophy)"/>
    <rect x="360" y="64" width="16" height="11" rx="5" fill="#a020f0"/>
    <text x="368" y="73" font-family="'Courier New',monospace" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="700">S</text>
    <text x="396" y="75" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#c060ff" font-weight="700">AI Explorer</text>
    <text x="396" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#9040d0">NLP &amp; LLMs &amp; Gen AI</text>
    <text x="396" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#6820a0">AI/ML developer</text>
    <rect x="324" y="52" width="140" height="88" rx="10" fill="none" stroke="#a020f0" stroke-width="1.5" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
  </g>

  <!-- ===== ROW 2 ===== -->

  <!-- Cell 4: Data Wizard -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.15s"/>
    <rect x="16" y="154" width="140" height="88" rx="10" fill="url(#cellBg)" stroke="#c0c0c0" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 58 174 Q 54 174 54 180 Q 54 190 64 193 Q 66 198 60 200 L 80 200 Q 74 198 76 193 Q 86 190 86 180 Q 86 174 82 174 Z" fill="url(#silverTrophy)" filter="url(#trGlowSoft)"/>
    <rect x="64" y="198" width="12" height="4" rx="2" fill="url(#silverTrophy)"/>
    <rect x="60" y="202" width="20" height="3" rx="1.5" fill="url(#silverTrophy)"/>
    <rect x="52" y="166" width="16" height="11" rx="5" fill="#c8c8c8"/>
    <text x="60" y="175" font-family="'Courier New',monospace" font-size="7" fill="#333" text-anchor="middle" font-weight="700">A</text>
    <text x="88" y="177" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#d0d0d0" font-weight="700">Data Wizard</text>
    <text x="88" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#a0a0a0">MySQL &amp; SQL design</text>
    <text x="88" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#808080">Database architect</text>
    <rect x="16" y="154" width="140" height="88" rx="10" fill="none" stroke="#c0c0c0" stroke-width="1.5" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.4;0" dur="2.5s" repeatCount="indefinite" begin="1.15s"/>
    </rect>
  </g>

  <!-- Cell 5: Multi-Stack -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.4s"/>
    <rect x="170" y="154" width="140" height="88" rx="10" fill="url(#cellBg)" stroke="#00c8e0" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 212 174 Q 208 174 208 180 Q 208 190 218 193 Q 220 198 214 200 L 234 200 Q 228 198 230 193 Q 240 190 240 180 Q 240 174 236 174 Z" fill="url(#cyanTrophy)" filter="url(#trGlowSoft)"/>
    <rect x="218" y="198" width="12" height="4" rx="2" fill="url(#cyanTrophy)"/>
    <rect x="214" y="202" width="20" height="3" rx="1.5" fill="url(#cyanTrophy)"/>
    <rect x="206" y="166" width="16" height="11" rx="5" fill="#00c8e0"/>
    <text x="214" y="175" font-family="'Courier New',monospace" font-size="7" fill="#003040" text-anchor="middle" font-weight="700">A</text>
    <text x="242" y="177" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#60e8ff" font-weight="700">Multi-Stack</text>
    <text x="242" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#30b0d0">Python • JS • Java • C++</text>
    <text x="242" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#108090">Polyglot developer</text>
    <rect x="170" y="154" width="140" height="88" rx="10" fill="none" stroke="#00c8e0" stroke-width="1.5" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.4;0" dur="2.5s" repeatCount="indefinite" begin="1.4s"/>
    </rect>
  </g>

  <!-- Cell 6: Idea Maker -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.65s"/>
    <rect x="324" y="154" width="140" height="88" rx="10" fill="url(#cellBg)" stroke="#cd7f32" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 366 174 Q 362 174 362 180 Q 362 190 372 193 Q 374 198 368 200 L 388 200 Q 382 198 384 193 Q 394 190 394 180 Q 394 174 390 174 Z" fill="url(#bronzeTrophy)" filter="url(#trGlowSoft)"/>
    <rect x="372" y="198" width="12" height="4" rx="2" fill="url(#bronzeTrophy)"/>
    <rect x="368" y="202" width="20" height="3" rx="1.5" fill="url(#bronzeTrophy)"/>
    <rect x="360" y="166" width="16" height="11" rx="5" fill="#cd7f32"/>
    <text x="368" y="175" font-family="'Courier New',monospace" font-size="7" fill="#2a1000" text-anchor="middle" font-weight="700">B</text>
    <text x="396" y="177" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#e8a040" font-weight="700">Idea Maker</text>
    <text x="396" y="191" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#b07030">Turns ideas into code</text>
    <text x="396" y="205" font-family="'Segoe UI',Arial,sans-serif" font-size="8.5" fill="#805020">Practical builder</text>
    <rect x="324" y="154" width="140" height="88" rx="10" fill="none" stroke="#cd7f32" stroke-width="1.5" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.4;0" dur="2.5s" repeatCount="indefinite" begin="1.65s"/>
    </rect>
  </g>

  <!-- Shine sweep -->
  <rect x="-480" y="0" width="480" height="280" fill="url(#trShine)">
    <animate attributeName="x" values="-480;480" dur="4.5s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- Border -->
  <rect x="1" y="1" width="478" height="278" rx="13" fill="none" stroke="#ff6ec7" stroke-width="1.5" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
