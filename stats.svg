<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-label="Mann Checker - Profile Stats">
<defs>
  <clipPath id="statsClip"><rect width="480" height="200" rx="14" ry="14"/></clipPath>
  <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d0014"/>
    <stop offset="100%" stop-color="#1a0030"/>
  </linearGradient>
  <linearGradient id="statsTitle" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#a020f0"/>
  </linearGradient>
  <linearGradient id="ringTrack" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#a020f0"/>
  </linearGradient>
  <linearGradient id="shineSwipe" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<g clip-path="url(#statsClip)">
  <!-- Background -->
  <rect width="480" height="200" fill="url(#statsBg)"/>
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#c850c0" stroke-width="0.5">
    <line x1="0" y1="40" x2="480" y2="40"/><line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="120" x2="480" y2="120"/><line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="96" y1="0" x2="96" y2="200"/><line x1="192" y1="0" x2="192" y2="200"/>
    <line x1="288" y1="0" x2="288" y2="200"/><line x1="384" y1="0" x2="384" y2="200"/>
  </g>

  <!-- Title -->
  <text x="24" y="32" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="url(#statsTitle)" filter="url(#statGlow)">Mann Checker — Profile Stats</text>
  <line x1="24" y1="40" x2="456" y2="40" stroke="#c850c0" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Rank ring (left) — decorative, no fake number -->
  <circle cx="72" cy="115" r="46" fill="none" stroke="#1e0035" stroke-width="10"/>
  <!-- Animated ring arc -->
  <circle cx="72" cy="115" r="46" fill="none" stroke="url(#ringTrack)" stroke-width="7"
    stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round"
    transform="rotate(-90 72 115)" filter="url(#ringGlow)">
    <animate attributeName="stroke-dashoffset" values="289;72" dur="2s" fill="freeze" begin="0.5s"
      calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </circle>
  <!-- Ring label -->
  <text x="72" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#ff6ec7" text-anchor="middle" font-weight="700">CS</text>
  <text x="72" y="126" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#c850c0" text-anchor="middle">Grad</text>
  <text x="72" y="175" font-family="'Courier New',monospace" font-size="9" fill="#a020f0" text-anchor="middle">Backend + AI</text>

  <!-- Stat rows (slide in from right) -->
  <!-- Row 1 -->
  <g opacity="0" transform="translate(40,0)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.6s"/>
    <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" fill="freeze" begin="0.6s" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    <text x="145" y="62" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#d0a0e0">🎓  Computer Science Graduate</text>
  </g>
  <!-- Row 2 -->
  <g opacity="0" transform="translate(40,0)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.85s"/>
    <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" fill="freeze" begin="0.85s" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    <text x="145" y="86" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#c890d8">⚙️  Backend Developer  •  FastAPI  •  Spring Boot</text>
  </g>
  <!-- Row 3 -->
  <g opacity="0" transform="translate(40,0)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.1s"/>
    <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" fill="freeze" begin="1.1s" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    <text x="145" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#b878c8">🤖  AI / ML  •  NLP  •  LLMs  •  Gen AI</text>
  </g>
  <!-- Row 4 -->
  <g opacity="0" transform="translate(40,0)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.35s"/>
    <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" fill="freeze" begin="1.35s" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    <text x="145" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#a060b8">🐍  Python  •  TypeScript  •  JavaScript</text>
  </g>
  <!-- Row 5 -->
  <g opacity="0" transform="translate(40,0)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.6s"/>
    <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" fill="freeze" begin="1.6s" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    <text x="145" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9050a8">🗄️  MySQL  •  SQL  •  Database Design</text>
  </g>
  <!-- Row 6 -->
  <g opacity="0" transform="translate(40,0)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.85s"/>
    <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" fill="freeze" begin="1.85s" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    <text x="145" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#804098">💡  Building ideas into working software</text>
  </g>

  <!-- Vertical divider -->
  <line x1="128" y1="48" x2="128" y2="190" stroke="#c850c0" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Shine sweep -->
  <rect x="-480" y="0" width="480" height="200" fill="url(#shineSwipe)">
    <animate attributeName="x" values="-480;480" dur="4s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- Border -->
  <rect x="1" y="1" width="478" height="198" rx="13" fill="none" stroke="#ff6ec7" stroke-width="1.5" stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
